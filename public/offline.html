<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OneNav - 离线</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #f8fafc 0%, #ffffff 40%, #eff6ff 100%);
      color: #1e293b;
      text-align: center;
      padding: 24px;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: linear-gradient(135deg, #1e293b 0%, #334155 50%, #1e293b 100%);
        color: #f1f5f9;
      }
    }

    .card {
      max-width: 380px;
      width: 100%;
      padding: 48px 36px;
      border-radius: 24px;
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(226,232,240,0.6);
      box-shadow: 0 25px 50px -12px rgba(59,130,246,0.08);
    }

    @media (prefers-color-scheme: dark) {
      .card {
        background: rgba(30,41,59,0.9);
        border-color: rgba(51,65,85,0.6);
        box-shadow: 0 25px 50px -12px rgba(59,130,246,0.15);
      }
    }

    .logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: linear-gradient(135deg, #3b82f6 0%, #0ea5e9 50%, #06b6d4 100%);
      box-shadow: 0 12px 24px -8px rgba(59,130,246,0.35);
      margin-bottom: 24px;
    }

    .logo span {
      color: white;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 18px;
      font-weight: 700;
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #1e293b;
    }

    @media (prefers-color-scheme: dark) {
      h1 { color: #f1f5f9; }
    }

    p {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 32px;
      line-height: 1.6;
    }

    @media (prefers-color-scheme: dark) {
      p { color: #64748b; }
    }

    .divider {
      height: 1px;
      background: rgba(226,232,240,0.6);
      margin-bottom: 24px;
    }

    @media (prefers-color-scheme: dark) {
      .divider { background: rgba(51,65,85,0.6); }
    }

    button {
      width: 100%;
      height: 48px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      background: linear-gradient(135deg, #3b82f6 0%, #0ea5e9 100%);
      color: white;
      box-shadow: 0 8px 24px -6px rgba(59,130,246,0.35);
      font-family: 'Space Grotesk', sans-serif;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 32px -6px rgba(59,130,246,0.45);
    }

    button.loading {
      pointer-events: none;
      opacity: 0.7;
    }

    .spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-right: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    button.loading .spinner {
      display: inline-block;
    }

    .footer {
      margin-top: 32px;
      font-size: 12px;
      color: #94a3b8;
    }

    @media (prefers-color-scheme: dark) {
      .footer { color: #475569; }
    }

    .footer span {
      font-family: 'Space Grotesk', sans-serif;
    }
  </style>
</head>
<body>
    <div class="card">
    <div class="logo">
      <span>ON</span>
    </div>

    <h1>网络连接已断开</h1>

    <p id="statusMsg">您当前处于离线状态，请检查网络连接后重试。已缓存的内容仍可正常访问。</p>

    <button id="retryBtn" onclick="retry()">
      <span class="spinner"></span><span class="label">重新连接</span>
    </button>

    <div class="divider"></div>

    <p class="footer">
      <span>OneNav</span> &mdash; 书签导航管理
    </p>
  </div>
  <script>
    const btn = document.getElementById('retryBtn');
    const label = document.querySelector('.label');
    const msg = document.getElementById('statusMsg');

    async function retry() {
      btn.classList.add('loading');
      label.textContent = '检测网络中...';

      try {
        const res = await fetch('/', { method: 'HEAD', cache: 'no-store' });
        if (res.ok) {
          label.textContent = '已连接，跳转中...';
          location.reload();
        } else {
          throw new Error('server error');
        }
      } catch {
        btn.classList.remove('loading');
        label.textContent = '重新连接';
        msg.innerHTML = '网络仍未恢复，请确认 Wi-Fi 或移动数据已开启后重试。';
      }
    }
  </script>
</body>
</html>
